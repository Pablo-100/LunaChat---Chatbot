<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaChat</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LunaChat</h1>
            <p>Posez vos questions à votre compagnon conversationnel</p>
        </header>
        <main>
            <div class="chat-container" id="chatContainer">
                <div class="welcome-message">
                    <h2>Bienvenue sur LunaChat</h2>
                    <p>Je suis ici pour répondre à vos questions avec douceur et intelligence. <br> Comment puis-je vous aider aujourd'hui ?</p>
                </div>
            </div>
            <div class="input-container">
                <textarea id="userInput" placeholder="Tapez votre question ici..." rows="1"></textarea>
                <button id="sendButton">➤</button>
            </div>
        </main>
       <footer>
    <p>ING-3-J-G TBINI & AMRI</p>
</footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
